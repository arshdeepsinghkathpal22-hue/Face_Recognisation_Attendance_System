<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: #eef3f8; color: #111827; }
    button { cursor: pointer; border: 0; font: inherit; }
    .app-shell { min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(135deg, #08111f 0%, #10283a 38%, #eef3f8 38.2%, #f8fafc 100%); }
    .topbar { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 14px 48px; background: rgba(255,255,255,.9); border-bottom: 1px solid rgba(15,23,42,.08); backdrop-filter: blur(18px); }
    .topbar > div { min-width: 0; }
    .brand { font-size: 20px; font-weight: 950; letter-spacing: .08em; color: #07111f; }
    .signout { flex: 0 0 auto; background: #07111f; color: #fff; padding: 11px 16px; border-radius: 8px; font-size: 12px; font-weight: 850; line-height: 1.15; box-shadow: 0 12px 24px rgba(7,17,31,.18); white-space: nowrap; }
    .content { width: min(1180px, calc(100% - 32px)); margin: 34px auto; flex: 1; }
    .page-title { margin: 0 0 24px; font-size: 34px; font-weight: 950; letter-spacing: 0; color: #fff; line-height: 1.08; overflow-wrap: anywhere; }
    .card { background: rgba(255,255,255,.96); border: 1px solid rgba(226,232,240,.9); border-radius: 12px; box-shadow: 0 24px 70px rgba(7,17,31,.14); }
    .card h3 { margin: 0 0 14px; line-height: 1.25; }
    .font-bold { font-weight: 850; }
    .text-xs { font-size: 12px; }
    .text-sm { font-size: 14px; }
    .text-\[9px\] { font-size: 9px; }
    .mt-1 { margin-top: 4px; }
    .mt-3 { margin-top: 12px; }
    .mb-1 { margin-bottom: 4px; }
    .p-0\.5 { padding: 2px; }
    .p-5 { padding: 20px; }
    .rounded-xl { border-radius: 12px; }
    .rounded-full { border-radius: 999px; }
    .border { border-width: 1px; border-style: solid; }
    .border-gray-100 { border-color: #f3f4f6; }
    .border-amber-200 { border-color: #fde68a; }
    .bg-white { background: #fff; }
    .bg-amber-50 { background: #fffbeb; }
    .bg-amber-500 { background: #f59e0b; }
    .text-white { color: #fff; }
    .text-gray-500 { color: #6b7280; }
    .text-gray-600 { color: #4b5563; }
    .text-gray-900 { color: #111827; }
    .text-amber-700 { color: #b45309; }
    .text-emerald-700 { color: #047857; }
    .text-red-600 { color: #dc2626; }
    .font-semibold { font-weight: 700; }
    .font-extrabold { font-weight: 800; }
    .uppercase { text-transform: uppercase; }
    .shadow-sm { box-shadow: 0 1px 2px rgba(15,23,42,.06); }
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .w-4 { width: 16px; }
    .h-4 { height: 16px; }
    .hidden { display: none; }
    .absolute { position: absolute; }
    .inset-0 { inset: 0; }
    .h-full { height: 100%; }
    .w-full { width: 100%; }
    .object-cover { object-fit: cover; }
    .aspect-video { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: linear-gradient(135deg, #020617, #172554); border-radius: 12px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
    .attendance-log-scroll { display: grid; gap: 12px; max-height: 520px; overflow: auto; }
    .signout:hover { background: #0e7490; }
    @media (max-width: 820px) {
      .topbar { padding: 14px 18px; align-items: flex-start; }
      .content { width: min(100% - 24px, 1180px); margin-top: 24px; }
      .page-title { font-size: 26px; color: #07111f; }
      main > div[style*="grid-template-columns"] { grid-template-columns: 1fr !important; }
      .signout { padding-inline: 13px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand">FACEGRID</div>
        <div class="text-xs">Administrator</div>
      </div>
      <button class="signout">Sign Out</button>
    </header>
    <main class="content">
      <h1 class="page-title">DAA - F5F6 - 4th Semester</h1>
      <div style="display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(320px, .6fr); gap: 24px;">
        <section class="card" data-purpose="video-section" style="padding: 20px;">
          <h3 class="font-bold">Live Camera</h3>
          <div class="aspect-video">
            <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
              <path d="M23 7l-7 5 7 5V7z"></path>
              <rect x="1" y="5" width="15" height="14" rx="2"></rect>
            </svg>
          </div>
          <button class="signout" style="margin-top: 18px; background: #be123c;">Stop & Submit Attendance</button>
        </section>
        <section class="card" data-purpose="attendance-log" style="padding: 20px;">
          <h3 class="font-bold">Attendance Log</h3>
          <div class="attendance-log-scroll"></div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
