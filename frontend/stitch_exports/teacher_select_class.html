<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: #eef3f8; color: #111827; }
    button { cursor: pointer; border: 0; font: inherit; }
    .app-shell { min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(135deg, #08111f 0%, #12313a 45%, #f3f6fb 45.2%, #eef3f8 100%); }
    .topbar { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 14px 48px; background: rgba(255,255,255,.88); border-bottom: 1px solid rgba(15,23,42,.08); backdrop-filter: blur(18px); }
    .topbar > div { min-width: 0; }
    .brand { font-size: 20px; font-weight: 950; letter-spacing: .08em; color: #07111f; }
    .signout { flex: 0 0 auto; background: #07111f; color: #fff; padding: 11px 16px; border-radius: 8px; font-size: 12px; font-weight: 850; line-height: 1.15; box-shadow: 0 12px 24px rgba(7,17,31,.18); white-space: nowrap; }
    .content { width: min(1180px, calc(100% - 32px)); margin: 34px auto; flex: 1; }
    .page-title { margin: 0 0 8px; font-size: 34px; font-weight: 950; letter-spacing: 0; color: #fff; line-height: 1.08; overflow-wrap: anywhere; }
    .muted { color: #6b7280; }
    .grid { display: grid; }
    .grid-cols-\[minmax\(0\,1\.5fr\)_minmax\(0\,0\.7fr\)_8rem\] { grid-template-columns: minmax(0,1.5fr) minmax(0,.7fr) 8rem; }
    .bg-white { background: rgba(255,255,255,.96); }
    .bg-\[\#f5f5f5\] { background: #f5f5f5; }
    .bg-\[\#1a1a1a\] { background: #1a1a1a; }
    .bg-gray-700 { background: #374151; }
    .rounded-xl { border-radius: 12px; }
    .rounded-lg { border-radius: 10px; }
    .rounded-md { border-radius: 8px; }
    .border { border-width: 1px; border-style: solid; }
    .border-transparent { border-color: transparent; }
    .border-red-200 { border-color: #fecaca; }
    .text-gray-700 { color: #374151; }
    .text-red-700 { color: #b91c1c; }
    .text-white { color: #fff; }
    .font-bold { font-weight: 800; }
    .font-semibold { font-weight: 700; }
    .text-sm { font-size: 14px; }
    .text-xs, .text-\[12px\] { font-size: 12px; }
    .text-lg { font-size: 18px; }
    .text-right { text-align: right; }
    .items-center { align-items: center; }
    .gap-3 { gap: 12px; }
    .mb-3 { margin-bottom: 12px; }
    .mb-6 { margin-bottom: 24px; }
    .px-5 { padding-left: 20px; padding-right: 20px; }
    .py-2\.5 { padding-top: 10px; padding-bottom: 10px; }
    .p-5 { padding: 20px; }
    .p-6 { padding: 24px; }
    .p-10 { padding: 40px; }
    .w-full { width: 100%; }
    .shadow-sm { box-shadow: 0 1px 2px rgba(15,23,42,.06); }
    .transition-colors { transition: color .16s ease, background-color .16s ease, border-color .16s ease; }
    .space-y-3 > * + * { margin-top: 12px; }
    .px-16 { padding-left: 0; padding-right: 0; }
    section h3 { margin-top: 0; line-height: 1.25; }
    [data-class-id] span { min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
    section[data-purpose="classes-grid-container"] { margin-top: 26px; border: 1px solid rgba(255,255,255,.55); background: rgba(255,255,255,.9) !important; box-shadow: 0 24px 70px rgba(7,17,31,.18); backdrop-filter: blur(16px); }
    [data-class-id] { box-shadow: 0 12px 30px rgba(15,23,42,.06); }
    [data-class-id] button { background: #07111f !important; border-radius: 8px; }
    [data-class-id] button:hover, .signout:hover { background: #0e7490 !important; }
    @media (max-width: 820px) {
      .topbar { padding: 14px 18px; align-items: flex-start; }
      .content { width: min(100% - 24px, 1180px); margin-top: 24px; }
      .page-title { font-size: 26px; color: #07111f; }
      section[data-purpose="classes-grid-container"] { padding: 22px !important; }
      .grid-cols-\[minmax\(0\,1\.5fr\)_minmax\(0\,0\.7fr\)_8rem\] { grid-template-columns: minmax(0,1.2fr) minmax(68px,.6fr) minmax(88px,.7fr); }
      .signout { padding-inline: 13px; }
    }
    @media (max-width: 560px) {
      .grid-cols-\[minmax\(0\,1\.5fr\)_minmax\(0\,0\.7fr\)_8rem\] { grid-template-columns: 1fr; }
      .text-right { text-align: left; }
      [data-class-id] button { width: max-content; min-width: 88px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand">FACEGRID</div>
        <div class="text-xs muted">Teacher: Jane Doe</div>
      </div>
      <button class="signout">Sign Out</button>
    </header>
    <main class="content">
      <h1 class="page-title">Teacher Dashboard: Select Class</h1>
      <p style="color: #cbd5e1; font-weight: 650;">Choose a class to begin live attendance.</p>
      <div class="px-16 grid grid-cols-2 gap-10">
        <div style="padding: 24px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px;">Class choices load here.</div>
      </div>
      <!-- Spacer to push footer down if content is short -->
      <div style="height: 32px;"></div>
      <button class="signout">Next: Record Attendance</button>
    </main>
  </div>
</body>
</html>
